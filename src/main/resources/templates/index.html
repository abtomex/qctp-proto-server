<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Файл → Base64 → QR</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 900px; margin: 40px auto; padding: 20px; }
        h1 { color: #333; }
        form { background: #f4f4f9; padding: 20px; border-radius: 10px; }
        input[type=file] { display: block; margin: 15px 0; }
        button { background: #0066cc; color: white; padding: 10px 25px; border: none;
                 border-radius: 6px; font-size: 16px; cursor: pointer; }
        button:hover { background: #0052a3; }
        .error { color: red; margin-top: 15px; }
        .info { color: #555; font-size: 14px; line-height: 1.6; }
    </style>
</head>
<body>
<h1>Загрузка файла и генерация QR-кодов</h1>
<div class="info">
    Файл будет закодирован в Base64, разделён на части по <b>5 КБ</b>,
    и для каждой части будет сгенерирован QR-код.
</div>

<form method="post" th:action="@{/upload}" enctype="multipart/form-data">
    <input type="file" name="file" required/>
    <button type="submit">Загрузить и сгенерировать</button>
</form>

<p class="error" th:if="${error}" th:text="${error}"></p>
</body>
</html>
